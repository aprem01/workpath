name: Daily Postgres Backup

# Disaster recovery: dumps the shared Neon Postgres every day at 06:00 UTC
# (01:00 Chicago / 02:00 Eastern) and uploads it as a GitHub Actions
# artifact. Artifacts are encrypted at rest by GitHub and retained for
# 90 days, giving us 3 months of point-in-time history at $0 cost.
#
# Manual trigger: Actions tab → "Daily Postgres Backup" → Run workflow.
#
# Restore: download the artifact (zip), unzip to get backup.sql.gz,
# pipe into psql against a fresh Neon branch. See DISASTER_RECOVERY.md.

on:
  schedule:
    - cron: '0 6 * * *'    # 06:00 UTC daily
  workflow_dispatch: {}     # manual trigger button

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install pg_dump
        run: |
          # Use the Postgres apt repo to get pg_dump 16 (matches Neon).
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump \
            --no-owner \
            --no-privileges \
            --clean \
            --if-exists \
            --format=plain \
            "$DATABASE_URL" \
            | gzip > "backup-${STAMP}.sql.gz"
          ls -lh backup-*.sql.gz
          # Quick sanity check — file should be at least 10 KB even if
          # empty schema, and should mention some known table names.
          if [ ! -s "backup-${STAMP}.sql.gz" ]; then
            echo "Backup empty — failing job"
            exit 1
          fi
          gunzip -t "backup-${STAMP}.sql.gz"
          echo "BACKUP_FILE=backup-${STAMP}.sql.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          # 90 days is the GitHub free-tier max artifact retention.
          retention-days: 90
